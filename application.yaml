spring:
  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: true
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  threads:
    virtual:
      enabled: true

logging:
  level:
    org.apache.kafka.clients: WARN
    org.apache.kafka.common: WARN
    zipkin2.reporter: DEBUG
    org.springframework.boot.zipkin: DEBUG
    io.micrometer.tracing: DEBUG

jwt:
  public-key: ${JWT_PUBLIC_KEY}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: "${spring.cloud.client.ip-address}:${spring.application.name}:${server.port:8080}"
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}


---

spring:
  config:
    activate:
      on-profile: k8s
  data:
    redis:
      host: redis.razorpay-core.svc.cluster.local
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka.razorpay-core.svc.cluster.local:9092}
  cloud:
    discovery:
      enabled: false
  task:
    scheduling:
      pool:
        size: 4

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

management:
  zipkin:
    tracing:
      endpoint: http://zipkin.razorpay-core.svc.cluster.local:9411/api/v2/spans

MERCHANT_SERVICE_URI: http://merchant-service
PAYMENT_SERVICE_URI: http://payment-service
VAULT_SERVICE_URI: http://vault-service
OPERATIONS_SERVICE_URI: http://operations-service
